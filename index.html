<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e3eaf1">
<title>WI 02 – Pressure Leaf Filter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#18202b;--mut:#5f6b7a;--line:rgba(24,32,43,.09);--amber:#f0a020;--glass:rgba(255,255,255,.84);--ac:#f0a020;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:#e3eaf1;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit}
body{background-color:#e3eaf1;
  background-image:radial-gradient(1100px 700px at 60% 35%,rgba(255,255,255,.75),rgba(255,255,255,0) 70%),linear-gradient(rgba(110,132,160,.15) 1px,transparent 1px),linear-gradient(90deg,rgba(110,132,160,.15) 1px,transparent 1px),linear-gradient(rgba(110,132,160,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(110,132,160,.08) 1px,transparent 1px);
  background-size:auto,120px 120px,120px 120px,24px 24px,24px 24px}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
#fallback{position:fixed;left:0;right:0;top:38%;text-align:center;color:#6b7480;font-size:14px;padding:0 24px;display:none}
.hidden{display:none!important}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border:1px solid rgba(255,255,255,.75);box-shadow:0 10px 34px rgba(25,40,70,.16),0 1px 3px rgba(25,40,70,.08)}

/* header */
#top{position:fixed;z-index:5;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;height:48px;display:flex;align-items:center;gap:10px;padding:0 8px 0 8px;border-radius:999px;max-width:560px}
#top .logo{width:34px;height:34px;border-radius:50%;background:#18202b;display:grid;place-items:center;flex:none}
#top .ttl{flex:1;min-width:0;line-height:1.15}
#top .ttl b{display:block;font-size:15.5px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .ttl small{display:block;font-size:11px;color:var(--mut);font-weight:600;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{border:0;background:#18202b;color:#fff;border-radius:999px;height:34px;padding:0 14px 0 11px;font:700 13px inherit;font-family:inherit;display:flex;align-items:center;gap:6px;cursor:pointer;flex:none}
.hbtn:hover{background:#2a3647}
/* rail */
#rail{position:fixed;z-index:5;right:12px;top:calc(max(10px,env(safe-area-inset-top)) + 62px);display:flex;flex-direction:column;gap:6px;padding:6px;border-radius:20px}
#rail button{width:50px;border:0;background:none;border-radius:14px;padding:7px 0 5px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-size:9.5px;font-weight:700;letter-spacing:.02em;color:#3b4656}
#rail button svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#rail button:hover{background:rgba(24,32,43,.07)}
#rail button.on{background:#18202b;color:#fff}
#tip{position:fixed;z-index:6;pointer-events:none;background:#18202b;color:#fff;font-size:12px;font-weight:600;padding:5px 10px;border-radius:8px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#toast{position:fixed;z-index:9;left:50%;top:calc(max(10px,env(safe-area-inset-top)) + 64px);transform:translate(-50%,-8px);background:#18202b;color:#fff;font-size:13px;font-weight:600;padding:8px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.22s;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
#coach{position:fixed;z-index:4;left:50%;transform:translateX(-50%);top:calc(max(10px,env(safe-area-inset-top)) + 64px);padding:8px 16px;border-radius:999px;font-size:12.5px;font-weight:600;color:#3b4656;white-space:nowrap;transition:opacity .5s;pointer-events:none}
#coach.off{opacity:0}
@media (max-width:560px){#coach{display:none}}

/* panels */
#home,#sheet,#sim{position:fixed;z-index:5;display:flex;flex-direction:column;border-radius:22px;animation:pop .28s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
#home{padding:18px 18px 16px}
#sheet,#sim{padding:0;max-height:54vh;overflow:hidden}
@media (max-width:899px){
  #home,#sheet,#sim{left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom))}
  #rail{top:calc(max(10px,env(safe-area-inset-top)) + 62px)}
  .desk{display:none!important}
}
@media (min-width:900px){
  #home,#sheet,#sim{left:16px;top:74px;bottom:16px;width:384px;max-height:none}
  #home,#sheet,#sim{bottom:auto}
  #sheet,#sim{max-height:calc(100vh - 90px)}
}
#home .eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--amber);text-transform:uppercase}
#home h1{font-size:22px;margin:4px 0 6px;letter-spacing:-.02em}
#home p{margin:0 0 12px;font-size:13.5px;line-height:1.5;color:var(--mut)}
.cta{border:0;background:#18202b;color:#fff;width:100%;padding:14px 18px;border-radius:14px;font:700 15px inherit;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;box-shadow:0 6px 18px rgba(24,32,43,.28);transition:transform .12s}
.cta:hover{transform:translateY(-1px)}
.cta svg{width:16px;height:16px;fill:currentColor}
.qrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.qrow button{flex:1;min-width:90px;border:1px solid var(--line);background:rgba(255,255,255,.7);border-radius:12px;padding:10px 8px;font:700 12.5px inherit;font-family:inherit;cursor:pointer}
.qrow button:hover{background:#fff}
#home .foot{margin-top:12px;font-size:11.5px;color:var(--mut);display:flex;gap:6px;align-items:center}
#home .foot i{width:6px;height:6px;border-radius:50%;background:var(--amber);flex:none}
.mhint{margin:8px 0 0;text-align:center;font-size:12.5px;color:var(--mut)}

#sheet .sbody,#sim .sbody{flex:1;overflow:auto;padding:14px 16px 6px;scrollbar-width:thin}
#sheet .top,#sim .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.seg{display:flex;gap:5px}
.seg div{flex:1;font-size:10px;font-weight:700;color:#8b95a3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em}
.seg i{display:block;height:5px;border-radius:3px;background:rgba(24,32,43,.1);margin-bottom:5px;position:relative;overflow:hidden}
.seg .done i{background:var(--c)}
.seg .act i:after{content:"";position:absolute;left:0;top:0;bottom:0;width:var(--p);background:var(--c);border-radius:3px;transition:width .4s}
.seg .act{color:var(--ink)}
.stepbtn{border:0;background:rgba(24,32,43,.06);border-radius:999px;font:700 12.5px inherit;font-family:inherit;color:#3b4656;padding:6px 12px;cursor:pointer}
.stepbtn:hover{background:rgba(24,32,43,.11)}
.x{border:0;background:rgba(24,32,43,.06);width:32px;height:32px;border-radius:50%;font-size:20px;line-height:1;color:#3b4656;cursor:pointer;display:grid;place-items:center}
.x:hover{background:rgba(24,32,43,.12)}
.eyeb{display:flex;align-items:center;gap:8px;margin:6px 0 2px;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ac)}
.badge{font-style:normal;background:var(--ac);color:#fff;border-radius:7px;padding:2px 7px;font-size:11.5px;letter-spacing:.02em}
#sheet h2,#sim h2{margin:2px 0 6px;font-size:19px;letter-spacing:-.015em;line-height:1.25}
#sheet p,#sim p{margin:0 0 10px;font-size:14px;line-height:1.55;color:#323d4b}
.chk{list-style:none;padding:0;margin:4px 0 4px}
.chk li{position:relative;padding-left:26px;margin-bottom:7px;font-size:14px;line-height:1.4;color:#323d4b}
.chk li:before{content:"";position:absolute;left:2px;top:2px;width:15px;height:15px;border:2px solid var(--ac);border-radius:5px}
.co{display:flex;gap:10px;border-radius:12px;padding:10px 12px;margin:8px 0;font-size:13px;line-height:1.45}
.co b{flex:none;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding-top:2px;min-width:54px}
.co.warn{background:#fff1ef;color:#7a2418}.co.warn b{color:#c8341f}
.co.tbc{background:#eef3ff;color:#25427a}.co.tbc b{color:#3358b8}
.co.note{background:#f1f4f7;color:#3b4656}.co.note b{color:#6a7686}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 12px}
.chip{border:1px solid rgba(24,32,43,.12);background:#fff;border-radius:999px;padding:7px 12px 7px 10px;font:700 12.5px inherit;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:7px;transition:.15s}
.chip:hover{border-color:var(--amber);background:#fff8e8}
.chip.sel{background:#fff1d1;border-color:var(--amber)}
.chip:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--amber)}
.chip.repair{--dc:#d9402b}.chip.service{--dc:#e8981a}.chip.ok{--dc:#3f9d63}.chip.check{--dc:#3f78c9}.chip.tbc{--dc:#8267cf}
.detail{background:rgba(255,255,255,.75);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:2px 0 12px;font-size:13.2px;line-height:1.5;color:#323d4b}
.detail .dh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px}
.detail .dh b{font-size:15px;color:var(--ink)}
.detail .k{display:block;margin-top:7px}.detail .k u{text-decoration:none;font-weight:800;color:var(--ink)}
.tg{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:3px 8px;white-space:nowrap;flex:none}
.tg.repair{background:#fde4df;color:#b3301d}.tg.service{background:#fdecc9;color:#8a5a00}.tg.ok{background:#dcf2e4;color:#23703f}.tg.check{background:#dce8fb;color:#245aa8}.tg.tbc{background:#e8e1f8;color:#5b44a8}
.link{border:0;background:none;font:700 13px inherit;font-family:inherit;text-decoration:underline;padding:2px 0 10px;cursor:pointer}
.nav{display:flex;gap:10px;padding:10px 16px 14px;border-top:1px solid var(--line);background:rgba(255,255,255,.55)}
.nav button{flex:1;padding:13px;border-radius:13px;font:700 14.5px inherit;font-family:inherit;cursor:pointer;border:1px solid rgba(24,32,43,.14);background:#fff}
.nav button.pri{background:var(--ac);border-color:var(--ac);color:#fff;flex:1.5;box-shadow:0 5px 14px rgba(24,32,43,.18)}
.nav button:disabled{opacity:.4;cursor:default}
.menu{margin:2px 0 10px;border:1px solid var(--line);border-radius:14px;max-height:210px;overflow:auto;background:#fff}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;font:inherit;font-size:13px;cursor:pointer;border-bottom:1px solid #eef0f3}
.menu button.cur{background:#fff1d1;font-weight:800}
.menu .sh{padding:6px 12px;font-size:10.5px;font-weight:800;letter-spacing:.08em;color:#fff;background:var(--c)}
/* group card */
.gc{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#fff;margin-bottom:10px}
.gc .gh{background:linear-gradient(135deg,#18202b,#2f3d52);color:#fff;padding:14px 16px}
.gc .gh small{display:block;font-size:10.5px;font-weight:800;letter-spacing:.12em;opacity:.7;text-transform:uppercase}
.gc .gh b{display:block;font-size:16px;margin-top:3px}
.gc dl{display:grid;grid-template-columns:76px 1fr;gap:6px 10px;margin:0;padding:12px 16px;font-size:13px}
.gc dt{font-size:10px;letter-spacing:.09em;color:var(--mut);font-weight:800;padding-top:3px}.gc dd{margin:0}
.mem{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 4px}
.mem div{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:7px 9px;font-size:12.5px;font-weight:600;line-height:1.2}
.mem i{font-style:normal;width:26px;height:26px;border-radius:50%;background:#18202b;color:#fff;font-size:10.5px;display:grid;place-items:center;flex:none;font-weight:800}
.lbl{position:fixed;left:0;top:0;pointer-events:none;background:rgba(24,32,43,.9);color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;transform:translate(-50%,-130%);z-index:3}

/* info modal */
#infoOv{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(18,26,38,.45);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
#infoOv .modal{background:#fbfcfd;width:min(900px,100%);height:min(88vh,860px);border-radius:24px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:pop .28s cubic-bezier(.2,.8,.2,1)}
@media (max-width:700px){#infoOv{align-items:stretch}#infoOv .modal{height:100%;border-radius:0}}
#infoOv header{display:flex;align-items:center;justify-content:space-between;padding:max(14px,env(safe-area-inset-top)) 16px 6px 22px}
#infoOv header small{display:block;font-size:10.5px;font-weight:800;letter-spacing:.12em;color:var(--amber);text-transform:uppercase}
#infoOv header b{font-size:18px;letter-spacing:-.01em}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:6px 18px 12px;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tabs button{flex:none;border:0;background:#eef1f5;border-radius:999px;padding:8px 14px;font:700 12.5px inherit;font-family:inherit;color:#3b4656;cursor:pointer;white-space:nowrap}
.tabs button:hover{background:#e2e7ee}
.tabs button.on{background:#18202b;color:#fff}
#infoBody{flex:1;overflow:auto;padding:6px 24px 48px;font-size:14.5px;line-height:1.6;color:#323d4b}
#infoBody h3{font-size:17px;margin:22px 0 8px;color:var(--ink);letter-spacing:-.01em}
#infoBody p{margin:0 0 10px}
.hero{background:linear-gradient(135deg,#18202b,#34445c);color:#fff;border-radius:18px;padding:20px 22px;margin-top:14px}
.hero h3,#infoBody .hero h3{color:#fff;margin:0 0 6px;font-size:20px}.hero p{margin:0;color:#cfd8e4}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0 6px}
@media (max-width:560px){.kpis{grid-template-columns:1fr 1fr}}
.kpis div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px}
.kpis b{display:block;font-size:20px;letter-spacing:-.02em}.kpis span{font-size:11.5px;color:var(--mut);font-weight:600}
table.kv{border-collapse:collapse;width:100%;font-size:13.5px;background:#fff;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
table.kv th,table.kv td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line)}
table.kv th{width:36%;background:#f4f6f9;color:var(--mut);font-size:12px}
table.kv tr:last-child th,table.kv tr:last-child td{border-bottom:0}
.note{background:#fff6e0;border-left:3px solid var(--amber);padding:9px 12px;font-size:13px;border-radius:6px}
ol.steps{list-style:none;counter-reset:s;padding:0;margin:8px 0 12px}
ol.steps li{counter-increment:s;position:relative;padding:2px 0 12px 40px}
ol.steps li:before{content:counter(s);position:absolute;left:0;top:0;width:27px;height:27px;border-radius:50%;background:#18202b;color:#fff;font-size:12.5px;font-weight:800;display:grid;place-items:center}
ol.steps li:after{content:"";position:absolute;left:13px;top:29px;bottom:2px;width:1px;background:rgba(24,32,43,.15)}
ol.steps li:last-child:after{display:none}
ul.ticks{list-style:none;padding:0;margin:6px 0 10px}
ul.ticks li{position:relative;padding-left:24px;margin-bottom:7px}
ul.ticks li:before{content:"";position:absolute;left:3px;top:6px;width:11px;height:6px;border-left:2.5px solid #3f9d63;border-bottom:2.5px solid #3f9d63;transform:rotate(-45deg)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.card b{display:block;margin-bottom:3px}.card span{font-size:13px;color:var(--mut)}
.acc details{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.acc summary{cursor:pointer;padding:12px 14px;font-weight:700;font-size:14px;list-style:none;display:flex;justify-content:space-between;gap:10px}
.acc summary::-webkit-details-marker{display:none}
.acc summary:after{content:"+";font-size:18px;line-height:1;color:var(--mut)}
.acc details[open] summary:after{content:"–"}
.acc details p{margin:0;padding:0 14px 13px;font-size:13.5px}
.scard{background:#fff;border:1px solid var(--line);border-left:5px solid #e8981a;border-radius:14px;padding:4px 16px 8px;margin:14px 0}
.scard h4{margin:12px 0 4px;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.scard.red{border-left-color:#d9402b;background:#fff7f5}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:10px}
.cc{text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 13px;cursor:pointer;font:inherit;transition:.15s;display:flex;flex-direction:column;gap:6px}
.cc:hover{border-color:var(--amber);box-shadow:0 6px 16px rgba(24,32,43,.1);transform:translateY(-1px)}
.cc .ch{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.cc b{font-size:14px;color:var(--ink);line-height:1.25}.cc span.f{font-size:12.5px;color:var(--mut);line-height:1.45}
.tl h3{display:flex;align-items:center;gap:8px}
.tl h3 i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.tli{display:flex;gap:12px;margin-bottom:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.tli>i{font-style:normal;flex:none;background:var(--c);color:#fff;font-weight:800;font-size:12px;height:24px;min-width:34px;display:grid;place-items:center;border-radius:8px;padding:0 6px}
.tli>div>b{display:block;margin-bottom:2px}.tli p{margin:0 0 6px;font-size:13.5px}
.tli .co{font-size:12.5px}
.sbtn{border:0;background:var(--amber);color:#18202b;font:700 14px inherit;font-family:inherit;padding:11px 18px;border-radius:12px;cursor:pointer}
.sbtn.ghost{background:#eef1f5;padding:6px 12px;font-size:12px;margin-top:2px}

.cta.alt{background:var(--amber);color:#18202b;box-shadow:0 6px 18px rgba(240,160,32,.35);margin-top:8px}
.note3d{position:fixed;left:0;top:0;pointer-events:none;background:#fff;color:#18202b;font-size:11.5px;font-weight:700;line-height:1.3;padding:5px 10px;border-radius:10px;max-width:170px;text-align:center;transform:translate(-50%,-135%);box-shadow:0 4px 14px rgba(25,40,70,.28);border:1.5px solid var(--amber);z-index:3}
.note3d:after{content:"";position:absolute;left:50%;bottom:-6px;width:9px;height:9px;background:#fff;border-right:1.5px solid var(--amber);border-bottom:1.5px solid var(--amber);transform:translateX(-50%) rotate(45deg)}
.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0 4px}
.hud div{background:#18202b;color:#fff;border-radius:11px;padding:7px 4px 6px;text-align:center}
.hud b{display:block;font-size:15px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.hud span{display:block;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#9fb0c4;margin-top:1px}
.simnote{font-size:11.5px;color:var(--mut);margin:6px 0 2px;line-height:1.4}
.sdots{display:flex;gap:3px;margin:2px 0 8px}
.sdots i{flex:1;height:5px;border-radius:3px;background:rgba(24,32,43,.1);position:relative;overflow:hidden;cursor:pointer}
.sdots i.done{background:var(--ac)}
.sdots i.act:after{content:"";position:absolute;left:0;top:0;bottom:0;width:var(--p);background:var(--ac)}
#sim .nav button.ic{flex:none;width:48px;padding:12px 0}
#sim .nav button.spd{flex:none;width:54px;padding:12px 0;font-size:13px}
#sim .nav{align-items:stretch}

/* ---- v4.1 layout refinements: one grid for header, panels and rail ---- */
:root{--gap:16px;--panelw:384px;--r:20px}
#top{border-radius:var(--r);height:52px;padding:0 9px 0 9px}
#home,#sheet,#sim{border-radius:var(--r)}
#rail{border-radius:var(--r)}
#home{padding:20px 18px 16px;gap:0}
#home .eyebrow{margin-bottom:2px}
#home h1{font-size:23px;margin:2px 0 8px}
#home p.desk{margin:0 0 14px}
.acts{display:grid;gap:8px}
.acts .cta{margin:0!important;min-height:58px;padding:10px 16px;justify-content:flex-start;gap:12px;text-align:left}
.acts .cta .ico{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.16)}
.acts .cta.alt .ico{background:rgba(24,32,43,.12)}
.acts .cta .ico svg{width:15px;height:15px}
.acts .cta b{display:block;font-size:15px;line-height:1.2}
.acts .cta small{display:block;font-size:11.5px;font-weight:600;opacity:.75;margin-top:2px;line-height:1.2}
.qrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.qrow button{min-width:0;padding:10px 6px}
#home .mhint{margin:10px 0 0}
#home .foot{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
#sheet .sbody,#sim .sbody{padding:16px 18px 8px}
#sheet .nav,#sim .nav{padding:12px 18px 16px}
#sim .nav{gap:8px}
#sim .nav button.pri{flex:1 1 auto;min-width:0}
#sim .hud{margin:12px 0 6px}
.modal-pad{padding:0}
#infoOv .modal{width:min(960px,100%)}
#infoBody{padding:8px 28px 56px}
#infoBody h3{margin:26px 0 10px;padding-top:2px}
#infoBody h3:first-child{margin-top:16px}
.tabs{padding:8px 22px 12px}
@media (min-width:900px){
  #top{left:var(--gap);top:var(--gap);right:auto;width:var(--panelw);max-width:none}
  #home,#sheet,#sim{left:var(--gap);top:calc(var(--gap) + 52px + 12px);width:var(--panelw)}
  #sheet,#sim{max-height:calc(100vh - 2*var(--gap) - 52px - 12px)}
  #rail{right:var(--gap);top:50%;transform:translateY(-50%)}
  #toast,#coach{top:calc(var(--gap) + 6px)}
}
@media (max-width:899px){
  #top{left:10px;right:74px;max-width:none;border-radius:var(--r)}
  #rail{right:10px;top:max(10px,env(safe-area-inset-top))}
  #home,#sheet,#sim{left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom))}
}
@media (max-width:899px) and (max-height:700px){#sheet,#sim{max-height:46vh}}
</style>

<header id="top" class="glass">
  <div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f0a020" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h14l-4 8v6l-4 3v-9z"/></svg></div>

</header>
<nav id="rail" class="glass">
  <button id="bReset" title="Reset view"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 9.5V20h5v-6h4v6h5V9.5"/></svg>Reset</button>
  <button id="bView" title="Change viewpoint"><svg viewBox="0 0 24 24"><path d="M12 2l9 5v10l-9 5-9-5V7zM12 12l9-5M12 12v10M12 12L3 7"/></svg><span id="vName">View</span></button>
  <button id="bLabels" title="Show part names"><svg viewBox="0 0 24 24"><path d="M20 12l-8 8-9-9V3h8z"/><circle cx="7.5" cy="7.5" r="1.3"/></svg>Labels</button>
  <button id="bXray" title="See inside the vessel"><svg viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>X-ray</button>
  <button id="bCover" title="Lift the vessel cover"><svg viewBox="0 0 24 24"><path d="M4 15h16v5H4zM12 3v8M8 7l4-4 4 4"/></svg>Cover</button>
</nav>
<div id="coach" class="glass">Drag to rotate · pinch or scroll to zoom · tap any part</div>
<div id="tip" class="hidden"></div>
<div id="toast"></div>
<section id="home" class="glass">
  <div class="eyebrow">WI 02 · ChE Laboratory 2</div>
  <h1>Pressure Leaf Filter</h1>
  <p class="desk">Explore the lab's pressure leaf filter in 3D. Tap any part to learn what it does, or follow the guided procedure from setup to backwash.</p>
  <div class="acts">
    <button class="cta alt" id="bSim"><span class="ico"><svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg></span><span><b>Run simulation</b><small>Watch a full filtration and backwash cycle</small></span></button>
    <button class="cta" id="bStart"><span class="ico"><svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg></span><span><b>Start procedure</b><small>Step-by-step guide from setup to records</small></span></button>
  </div>
  <div class="qrow desk"><button data-tab="principle">How it works</button><button data-tab="components">Components</button><button data-tab="safety">Safety</button></div>
  <p class="mhint">or tap any part to learn what it does</p>
  <div class="foot desk"><i></i><span id="homeFoot"></span></div>
</section>

<div id="sim" class="glass hidden"></div>
<div id="infoOv" class="hidden"></div>

<script>
/* =====================================================================
   EDIT HERE — all text shown in the viewer lives in this block.
   Sources: Lab manual WI 02 (Pressure Leaf Filter Equipment), ChE Lab 2
   Laboratory Plan, and the team's inspection photos.
   ===================================================================== */
window.CONTENT = {

  title: 'Pressure Leaf Filter',
  subtitle: 'WI 02 · ChE Laboratory 2',
  institution: 'Chemical Engineering Laboratory · Bicol University',

  group: {
    course: 'Chemical Engineering Laboratory 2',
    section: 'BS Chemical Engineering 4B',
    term: '1st Semester, S.Y. 2026-2027',
    equipment: 'WI 02 – Pressure Leaf Filter Equipment',
    members: [
      'Ricku Gabriel Areta',
      'Sandara Shayne Bron',
      'Kimberly Ann Lagrimas',
      'Marielle Mapa',
      'Ken Heinrich Ocbina',
      'Albert Samonte',
      'Rigil Kent Villanueva'
    ]
  },

  /* ---------- Components (tap them in the 3D view) ----------
     tag: repair | service | ok | check | tbc  (status shown as a badge) */
  valveNote: 'Valve numbers follow the manual (§10.2). Open = handle parallel to the pipe.',
  parts: {
    tank:      { name: 'Conditioning Tank', label: 'Conditioning tank', tag: 'repair', cam: { el: 1.0 },
      fn: 'Holds the process feed before filtration and is used to prepare it (1.0 kg coconut pulp in water). A hole in the middle of the tank floor feeds a pipe that runs forward under the tank and out past its front edge on the pump side. There a tee sends the feed on to the gear pump and, through a short branch, to the tank drain.',
      spec: 'Stainless steel · 65 L · Ø 15 in (0.381 m) × 58.7 cm high · feet 16.5 cm',
      status: 'Complete and in good condition, but heavy rust near the drain makes the outflow rusty. Rust removal and an anti-rust coating are planned.' },
    pump:      { name: 'Gear Pump', label: 'Gear pump', tag: 'service',
      fn: 'A positive-displacement pump that moves the feed from the conditioning tank into the pressure vessel and builds the pressure that drives filtration. Never run it with its outlet path closed.',
      spec: 'Length 34 cm · height 30 cm · belt-driven by the motor',
      status: 'Runs when powered, but could not yet draw and distribute water. The flow path is being checked. Needs cleaning and lubrication.' },
    motor:     { name: 'Electric Motor', label: 'Motor', tag: 'check',
      fn: 'Drives the gear pump through a belt and pulley.',
      status: 'Appears functional. Wiring was only taped around the pipes and should be secured.' },
    belt:      { name: 'Belt & Pulley', label: 'Belt & pulley', tag: 'repair',
      fn: 'Transmits power from the motor to the gear pump. The belt must be intact and the pulley clear of hands and clothing before starting.',
      status: 'Belt has minor damage and the pulley squeaks. A new V-belt, cleaning and lubrication are planned.' },
    frame:     { name: 'Pump Frame', label: null, tag: 'ok',
      fn: 'Steel support frame that carries the motor and gear pump, with black stopper-like feet for stable positioning.',
      status: 'No major problem recorded.' },
    switch:    { name: 'Circuit Breaker', label: 'Circuit breaker', tag: 'repair', cam: { az: -0.2, el: 0.3 },
      fn: 'Circuit breaker (13 × 7 cm) with the on/off toggles and an orange button, mounted against the electrical box. It turns the pump motor on and off.',
      status: 'Has no protective housing and the wires are taped to the pipes. A weatherproof enclosure and secured wiring are proposed.' },
    v1:        { name: 'Valve 1 · Feed Inlet', label: 'V1', tag: 'service',
      fn: 'OPEN during filtration so the feed from the pump enters the pressure vessel. CLOSED during backwashing.' },
    v2:        { name: 'Valve 2 · Backwash Inlet', label: 'V2', tag: 'service',
      fn: 'On the long pipe, just after it leaves the pump riser beside the breaker. CLOSED during filtration. OPENED for backwashing to send the pump flow along the long pipe to the far end of the vessel.' },
    v3:        { name: 'Valve 3 · Backwash Outlet', label: 'V3', tag: 'service',
      fn: 'On the vertical drop pipe (about 50 cm, open end) at the far end of the long pipe. CLOSED during filtration. OPENED for backwashing so the water leaves to disposal.' },
    v4:        { name: 'Valve 4 · Filtrate Outlet', label: 'V4', tag: 'service',
      fn: 'On the horizontal pipe at the top of the filtrate line, beside the vessel. OPEN during filtration; CLOSED during backwashing.' },
    faucet:    { name: 'Filtrate Faucet', label: 'Filtrate faucet', tag: 'ok', cam: { az: 0.55, el: 0.3 },
      fn: 'Clear plastic tap at the bottom of the vertical filtrate pipe (36 cm), which rises from a low port on the vessel next to one of its legs. The filtrate is collected here in a container. It stays closed until the pump is running and is closed again before shutdown.' },
    drain:     { name: 'Vessel Drain Valve', label: 'Vessel drain', tag: 'service',
      fn: 'Drains the pressure vessel from the lowest point of its dished bottom. Closed during filtration; opened to drain only after the pressure has been released.',
      status: 'Seized valves were noted in the diagnosis: clean, lubricate or replace.' },
    vessel:    { name: 'Pressure Vessel', label: 'Pressure vessel', tag: 'repair',
      fn: 'Closed vessel where pressure builds up. That pressure is the driving force that pushes the liquid through the filter leaves while the solids stay behind.',
      spec: 'Ø 40 cm · 97 cm overall height · dished bottom · three 54 cm legs · bolted cover',
      status: 'The rubber gasket between cover and vessel was found broken, and the cover bolts and the internal leaf supports are rusted. A chemical-resistant gasket, stainless bolts and rust treatment are planned.' },
    lid:       { name: 'Cover, Gasket & Bolts', label: 'Vessel cover', tag: 'repair',
      fn: 'Seals the pressure vessel; the cover is bolted around its flange. The gasket must be seated and every cover bolt tight before running. Open the cover only when the gauge reads zero and the instructor allows it.',
      status: 'Gasket broken and bolts rusted: replace before the test run.' },
    leaves:    { name: 'Filter Leaves (×5)', label: 'Filter leaves', tag: 'service', cam: { az: -0.5, el: 0.5 },
      fn: 'Rectangular leaves hung on a tubular manifold. Each has a riveted metal frame, a fine filter mesh and a diamond-pattern expanded-wire support. Liquid passes through while solids collect on the surface as a cake that also acts as an extra filter layer.',
      spec: 'G.I. sheet frame · 324-mesh screen · 4-mesh expanded wire · 1500-mesh filter cloth · 5 leaves · 0.2547 m² total area',
      status: 'Screen, case and cloth look serviceable but dirty. The supporting parts inside are rusted. Clean, inspect and replace damaged leaves.' },
    gauge:     { name: 'Pressure Gauge', label: 'Pressure gauge', tag: 'check',
      fn: 'Shows the pressure inside the vessel. The observer watches it during the whole run. The limit set by the instructor is marked on it, and it must read zero before the cover is opened.',
      status: 'The only instrument found. It looked good but has not been tested yet.' },
    swingbolt: { name: 'Swing Bolt', label: 'Swing bolt', tag: 'ok',
      fn: 'Hinged eye bolt on the rim of the vessel cover, directly behind the pressure gauge. A pivoting eye carries a threaded rod with a washer and nut.' },
    tankdrain: { name: 'Tank Drain Valve', label: 'Tank drain', tag: 'service',
      fn: 'Lever-handled valve on the tank drain, just outside the pump-side wall of the conditioning tank. A short pipe from the tee turns down through an elbow and the valve, and ends in an open discharge pipe angled toward the floor. Closed during the run; used to empty the tank.' },
    ebox:      { name: 'Electrical Box', label: 'Electrical box', tag: 'ok', cam: { az: -0.2, el: 0.3 },
      fn: 'Gray metal electrical box mounted on the short pipe stub above the pump riser. It is wired to the circuit breaker that supplies power to the pump; the cable runs from it down to the motor.' },
    regulator: { name: 'Voltage Regulator', label: 'Voltage regulator', tag: 'service',
      fn: 'The equipment is plugged into the voltage regulator before the run, and unplugged after the pump is switched off.' },
    piping:    { name: 'Piping & Fittings', label: null, tag: 'check',
      fn: 'Pipes and fittings that carry the feed from the tank through the pump to the vessel, and the filtrate out of the vessel. Extra branches serve backwashing.',
      status: 'Joints are secure and no leaks were seen, but the insides are probably rusty after long inactivity. The 3D routing is schematic.' }
  },

  partGroups: [
    { name: 'Feed system', parts: ['tank', 'tankdrain', 'pump', 'motor', 'belt', 'frame', 'switch', 'ebox', 'regulator'] },
    { name: 'Pressure vessel', parts: ['vessel', 'lid', 'leaves', 'gauge', 'swingbolt', 'drain'] },
    { name: 'Valves & piping', parts: ['v1', 'v2', 'v3', 'v4', 'piping'] },
    { name: 'Filtrate collection', parts: ['faucet'] }
  ],

  /* ---------- Procedure ---------- */
  sections: [
    { key: 'A', name: 'Setup',     color: '#3f8ccb' },
    { key: 'B', name: 'Operation', color: '#e8981a' },
    { key: 'C', name: 'Shutdown',  color: '#3f9d63' },
    { key: 'D', name: 'Backwash',  color: '#8267cf' },
    { key: 'E', name: 'Records',   color: '#2a9ca6' },
    { key: 'G', name: 'Group',     color: '#7c8594' }
  ],

  /* text = main instruction (HTML ok) · warn = safety callout · tbc = to be confirmed · note = hint */
  steps: [
    { id: 'A1', sec: 'A', title: 'Wear PPE and sign the logbook', parts: ['regulator'],
      text: 'Wear the required PPE (gloves, goggles, laboratory gown, mask and closed shoes) and review the safety section. Sign the <b>Equipment Usage / Borrower’s Logbook</b> and record the condition of the equipment before use.',
      state: {} },
    { id: 'A2', sec: 'A', title: 'Inspect the components', parts: ['lid', 'ebox', 'switch', 'regulator', 'gauge'],
      text: 'Inspect the hoses, valves, seals, lid gasket, pump switch enclosure and power cord for damage, leaks or wear.',
      warn: 'If any defect is found, do not operate the equipment. Report it to the laboratory technician.',
      state: {} },
    { id: 'A3', sec: 'A', title: 'Prepare the pulp and water', parts: ['tank'],
      text: 'Strain the coconut pulp to remove shell pieces and large lumps. Weigh <b>1.0 kg</b> of the strained pulp and measure <b>4.6 L</b> of clean water. Record the actual values as the Initial Weight of Solids and Initial Volume of Liquid on the Data Sheet, and measure the water temperature.',
      state: {} },
    { id: 'A4', sec: 'A', title: 'Set the valves for filtration', parts: ['v1', 'v4', 'v2', 'v3', 'drain', 'faucet'],
      text: 'Open <b>Valve 1</b> and <b>Valve 4</b>. Keep <b>Valve 2</b> and <b>Valve 3</b> closed. Make sure the vessel drain and the filter faucet are closed.',
      note: 'A ball valve is open when its handle is parallel to the pipe and closed when the handle is perpendicular to it.',
      state: { v1: 1, v4: 1 } },
    { id: 'A5', sec: 'A', title: 'Fill the conditioning tank', parts: ['tank'],
      text: 'Pour the <b>4.6 L of water</b> into the conditioning tank, then add the coconut pulp gradually while stirring until the mixture is even.',
      state: { v1: 1, v4: 1, tank: 0.086, feed: 'pulp' } },
    { id: 'A6', sec: 'A', title: 'Plug in and place the container', parts: ['regulator', 'faucet'], cam: { az: 0.5, el: 0.3 },
      text: 'Plug the pump cord into the <b>voltage regulator</b> and place the empty graduated container under the filter faucet.',
      state: { v1: 1, v4: 1, tank: 0.086, feed: 'pulp' } },

    { id: 'B1', sec: 'B', title: 'Turn on the pump switch', parts: ['switch', 'ebox', 'pump', 'gauge'],
      text: 'Turn on the pump switch and read the pressure gauge. The pump starts and the pressure builds up in the vessel. Record the actual reading in kPa.',
      warn: 'Stay beside the equipment, not in front of the cover, and watch the gauge.',
      state: { v1: 1, v4: 1, tank: 0.084, feed: 'pulp', sw: 1, pump: 1, gauge: 0.5, vessel: 1.7, xray: 0.85 } },
    { id: 'B2', sec: 'B', title: 'Open the faucet and start the stopwatch', parts: ['faucet'], cam: { az: 0.5, el: 0.3 },
      text: 'Open the filter faucet and <b>start the stopwatch when the first filtrate flows</b>. The pressure pushes the liquid through the leaves; the solids stay on them as a cake.',
      state: { v1: 1, v4: 1, tank: 0.08, feed: 'pulp', sw: 1, pump: 1, gauge: 0.5, vessel: 1.7, faucet: 1, beaker: 0.05, cake: 0.25, xray: 0.85 } },
    { id: 'B3', sec: 'B', title: 'Read every 30 seconds', parts: ['faucet', 'gauge'], cam: { az: 0.5, el: 0.3 },
      text: 'Every <b>30 seconds</b>, read the cumulative filtrate volume (to the nearest 0.05 L) and the pressure gauge, and record them in Table 4. Note any cloudy filtrate, leak or pressure drift under Remarks.<br>If the container fills, pour it into the spare container and keep counting the total.',
      state: { v1: 1, v4: 1, tank: 0.05, feed: 'pulp', sw: 1, pump: 1, gauge: 0.5, vessel: 1.7, faucet: 1, beaker: 0.4, cake: 0.6, xray: 0.85 } },
    { id: 'B4', sec: 'B', title: 'Decide when to stop', parts: ['faucet', 'gauge'], cam: { az: 0.5, el: 0.3 },
      text: 'Stop the run when <b>only drops come out</b>, when the volume <b>does not change between two readings</b>, or after <b>15 minutes</b>. Record the filtration time and the volume of filtrate on the Data Sheet.',
      state: { v1: 1, v4: 1, tank: 0.03, feed: 'pulp', sw: 1, pump: 1, gauge: 0.5, vessel: 1.5, faucet: 1, beaker: 0.8, cake: 1, xray: 0.85 } },

    { id: 'C1', sec: 'C', title: 'Switch off and unplug first', parts: ['switch', 'regulator', 'pump'],
      text: 'Switch off the pump and <b>unplug it first</b>, before touching any valve.',
      state: { v1: 1, v4: 1, tank: 0.03, feed: 'pulp', sw: 0, pump: 0, gauge: 0.5, vessel: 1.5, faucet: 1, beaker: 0.8, cake: 1, xray: 0.85 } },
    { id: 'C2', sec: 'C', title: 'Close V1 and V4, then release the pressure', parts: ['v1', 'v4', 'drain', 'gauge'],
      text: 'Close <b>Valve 1</b> and <b>Valve 4</b>. Then <b>slowly open the vessel drain</b> to release the remaining pressure until the gauge reads zero.',
      state: { tank: 0.03, feed: 'pulp', drain: 1, gauge: 0, vessel: 0.4, faucet: 1, beaker: 0.8, cake: 1, xray: 0.85 } },

    { id: 'D1', sec: 'D', title: 'Check the pump is off', parts: ['switch', 'gauge'],
      text: 'Backwash after every filtration run. Make sure the pump is switched off and unplugged and that the pressure gauge reads <b>zero</b>.',
      state: { tank: 0.03, feed: 'pulp', drain: 1, gauge: 0, vessel: 0.05, faucet: 1, beaker: 0.8, cake: 1 } },
    { id: 'D2', sec: 'D', title: 'Empty the tank and add 10 L of water', parts: ['tank'],
      text: 'Empty the conditioning tank of the remaining mixture, then fill it with about <b>10 L of clean water</b>.',
      state: { tank: 0.154, feed: 'water', drain: 1, gauge: 0, faucet: 1, beaker: 0.8, cake: 1 } },
    { id: 'D3', sec: 'D', title: 'Close the filtration line', parts: ['v1', 'v4', 'drain', 'faucet'],
      text: 'Close <b>Valve 1</b>, <b>Valve 4</b>, the vessel drain and the filter faucet. These belong to the filtration line and must be closed so that the water flows in the reverse direction. The filter leaves stay inside the vessel.',
      state: { tank: 0.154, feed: 'water', cake: 1, beaker: 0.8 } },
    { id: 'D4', sec: 'D', title: 'Open valves 2 and 3', parts: ['v2', 'v3'],
      text: 'Open <b>Valve 2</b> and <b>Valve 3</b>.',
      state: { tank: 0.154, feed: 'water', v2: 1, v3: 1, cake: 1, beaker: 0.8 } },
    { id: 'D5', sec: 'D', title: 'Run the pump for 2 to 3 minutes', parts: ['regulator', 'switch', 'pump', 'leaves'],
      text: 'Plug the pump cord into the voltage regulator and turn on the pump. Let it run for <b>2 to 3 minutes</b>. Water flows backwards through the leaves and out through Valve 3.',
      state: { tank: 0.09, feed: 'water', v2: 1, v3: 1, sw: 1, pump: 1, gauge: 0.3, vessel: 1.5, cake: 0.3, beaker: 0.8, xray: 0.85 } },
    { id: 'D6', sec: 'D', title: 'Switch off, close V2 and V3, release pressure', parts: ['switch', 'v2', 'v3', 'gauge'],
      text: 'Switch off and <b>unplug the pump first</b>. Then close <b>Valve 2</b> and <b>Valve 3</b> and release the remaining pressure until the gauge reads zero.',
      state: { tank: 0.05, feed: 'water', gauge: 0, vessel: 0.1, cake: 0.1, beaker: 0.8 } },
    { id: 'D7', sec: 'D', title: 'Open the vessel and clean the leaves', parts: ['lid', 'leaves'],
      text: 'Open the vessel and remove the loosened cake with the <b>plastic scraper</b>. Rinse the leaves and gently brush the filter cloth with the <b>soft brush</b>. Check the cloth for tears or clogging and check that the lid gasket is seated, then close the vessel firmly.',
      warn: 'Use no metal tools on the filter cloth.',
      state: { tank: 0.05, feed: 'water', lid: 1, leaf: 1, beaker: 0.8 } },
    { id: 'D8', sec: 'D', title: 'Reset the valves', parts: ['v1', 'v4', 'v2', 'v3'],
      text: 'Reset the valves for filtration: <b>Valves 1 and 4 open</b>, <b>Valves 2 and 3 closed</b>. Dispose of the cake and the wash water in the organic waste.',
      state: { v1: 1, v4: 1, tank: 0.05, feed: 'water', beaker: 0.8 } },

    { id: 'E1', sec: 'E', title: 'Complete the records', parts: [],
      text: 'Complete the Data Sheet. Clean the equipment, enter the maintenance in the <b>Maintenance Log</b>, report any defect in the <b>Service and Repair Record</b>, and sign out in the <b>Logbook</b>.<br>For a second trial, repeat from preparing a fresh charge (1.0 kg of pulp and 4.6 L of water) and backwash again. Comparing the flux of the two trials gives the flux recovery.',
      state: {} },

    { id: 'G', sec: 'G', type: 'group', title: 'Group members', parts: [], text: '', state: {} }
  ],

  /* ---------- Info panel (the QR landing sections) ---------- */
  info: [
    { key: 'overview', name: 'Overview', html:
      '<div class="hero"><h3>WI 02 – Pressure Leaf Filter Equipment</h3>' +
      '<p>Liquid–solid filtration unit of the Chemical Engineering Laboratory, Bicol University. It separates suspended solids from a liquid using a pressurized vessel that contains stacked filter leaves.</p></div>' +
      '<div class="kpis"><div><b>5</b><span>filter leaves</span></div><div><b>0.2547 m²</b><span>filtering area</span></div><div><b>65 L</b><span>conditioning tank</span></div><div><b>1500</b><span>mesh filter cloth</span></div></div>' +
      '<h3>Equipment record</h3>' +
      '<table class="kv"><tr><th>Property no.</th><td>UOLE-015</td></tr>' +
      '<tr><th>Description</th><td>Leaf filter, fabricated</td></tr>' +
      '<tr><th>Property holder</th><td>Chemical Engineering Laboratory</td></tr>' +
      '<tr><th>Date acquired</th><td>March 2010</td></tr>' +
      '<tr><th>Data sheet</th><td>WI-CHE-001-F1</td></tr></table>' +
      '<h3>Where it is used</h3>' +
      '<p>Pressure leaf filters are used for edible oils, pharmaceuticals, chemicals, beverages, biodiesel, sugar syrup, water treatment, mining and metallurgy, and oil and gas.</p>' +
      '@TEAM@' },
    { key: 'principle', name: 'Operating Principle', html:
      '<h3>How it works</h3>' +
      '<ol class="steps"><li>The <b>gear pump</b> moves the feed from the <b>conditioning tank</b> into the <b>pressure vessel</b>.</li>' +
      '<li>Pressure builds up inside the vessel and pushes the liquid through the <b>filter leaves</b> (324-mesh screen, 4-mesh expanded wire, 1500-mesh cloth).</li>' +
      '<li>The solids stay on the leaves. The clear <b>filtrate</b> flows into the leaf manifold and out through the filtrate outlet.</li>' +
      '<li>As the cake builds up it acts as an extra filter layer and improves clarity, but flow drops. <b>Backwashing</b> reverses the flow to clean the leaves.</li></ol>' +
      '<p class="note">Higher pressure suits finer particles; lower pressure suits more robust solids. The sample feed in the lab is coconut pulp and water.</p>' },
    { key: 'components', name: 'Components', html: '@COMPONENTS@' },
    { key: 'procedure', name: 'Procedure', html: '@PROCEDURE@' },
    { key: 'testrun', name: 'Test Run', html:
      '<h3>Parameters to monitor</h3>' +
      '<div class="cards"><div class="card"><b>Pressure</b><span>On the gauge, against the limit set by the instructor</span></div>' +
      '<div class="card"><b>Water flow</b><span>From the tank through the pump and out as filtrate</span></div>' +
      '<div class="card"><b>Pump &amp; belt</b><span>Noise, vibration, belt slipping</span></div>' +
      '<div class="card"><b>Leaks</b><span>At the cover, gasket and joints</span></div>' +
      '<div class="card"><b>Valves</b><span>Response; open = handle parallel to the pipe</span></div></div>' +
      '<h3>Test run procedure</h3>' +
      '<ol class="steps"><li>Sign the logbook and inspect the components.</li>' +
      '<li>Strain and weigh <b>1.0 kg</b> of pulp, measure <b>4.6 L</b> of water, and set Valves 1 and 4 open, 2 and 3 closed.</li>' +
      '<li>Mix the feed in the tank, plug into the voltage regulator and turn on the pump switch.</li>' +
      '<li>Open the filter faucet, start the stopwatch at the first filtrate, and read volume and pressure <b>every 30 seconds</b>.</li>' +
      '<li>Stop when only drops come out, the volume stops changing, or after <b>15 minutes</b>.</li>' +
      '<li>Switch off and unplug first, close Valves 1 and 4, slowly open the vessel drain until the gauge reads zero, then backwash.</li></ol>' +
      '' },
    { key: 'maintenance', name: 'Maintenance', html:
      '<h3>Maintenance</h3>' +
      '<ul class="ticks"><li><b>Inspect</b> seals, joints and the equipment for damage and leaks.</li>' +
      '<li><b>Clean</b> regularly; remove rust and wipe dry after use.</li>' +
      '<li><b>Lubricate</b> the pump pulley and seized valves; check belt tension and condition.</li>' +
      '<li><b>Replace</b> the gasket, rusted bolts and damaged filter leaves as soon as needed.</li>' +
      '<li><b>Check pressure</b> during every run and <b>backwash</b> to keep the leaves clear.</li>' +
      '<li><b>Keep records</b> of every inspection, repair and replacement in the logbook.</li></ul>' +
      '<h3>Troubleshooting</h3>' +
      '<div class="acc">' +
      '<details><summary>Equipment does not turn on although switched on</summary><p>Power is insufficient. Use a voltage regulator.</p></details>' +
      '<details><summary>Feed comes out of the vessel</summary><p>Bolts are not tight or an exit valve is not open. Open the correct valve and tighten the bolts (gauge at zero).</p></details>' +
      '<details><summary>Low flow rate</summary><p>Leaves may be clogged. Switch off, check for fine particles or cake build-up, clean or replace leaves.</p></details>' +
      '<details><summary>Poor filtrate quality</summary><p>Filter media may be torn. Inspect and replace damaged leaves.</p></details>' +
      '<details><summary>Clogged pipeline</summary><p>Little or no filtrate. Check blockages and leaks, clean the piping, re-check the feed ratio.</p></details>' +
      '<details><summary>Pump runs but does not draw water</summary><p>Check the valve positions, the piping and the leaves for blockage.</p></details>' +
      '<details><summary>Leaking cover</summary><p>Gasket worn or bolts rusted. Release pressure, then replace the gasket and bolts.</p></details>' +
      '<details><summary>Squeaking pulley or slipping belt</summary><p>Clean, lubricate or replace the pulley and V-belt.</p></details></div>' },
    { key: 'safety', name: 'Safety', html:
      '<div class="scard"><h4>Before running</h4><ul class="ticks"><li>Only trained users operate the unit. Wear PPE: gloves, goggles, laboratory gown, mask and closed shoes.</li>' +
      '<li>Inspect the components before use and sign the logbook.</li>' +
      '<li>Roles: operator at the switch, observer at the gauge, one person ready to cut power.</li>' +
      '<li>Water and electricity are present: wipe spills immediately.</li></ul></div>' +
      '<div class="scard"><h4>While running</h4><ul class="ticks"><li>Watch the gauge throughout the run.</li>' +
      '<li>Never run the gear pump with its outlet path closed.</li>' +
      '<li>Stand to the side, never in front of the cover. Do not leave it running unattended.</li>' +
      '<li>Do not tighten or loosen the cover, bolts or fittings while the vessel is pressurized.</li>' +
      '<li><b>Stop at:</b> pressure over the limit or a sudden drop, leaks or spraying, squeaking or vibration, belt slipping or burning smell, hot motor/switch/cord, smoke or sparks, pump running with no water, no filtrate, cloudy filtrate.</li></ul></div>' +
      '<div class="scard"><h4>Shutdown</h4><ol class="steps"><li>Switch off and unplug the pump first.</li><li>Close Valves 1 and 4, then slowly open the vessel drain until the gauge reads zero.</li>' +
      '<li>Backwash after every run.</li><li>Open the cover only at zero pressure with the instructor’s permission.</li>' +
      '<li>Clean, check for leaks and record in the logbook.</li></ol></div>' +
      '<div class="scard red"><h4>Emergency</h4><ul class="ticks"><li><b>Malfunction or leak:</b> switch off the pump, unplug if safe, step away, tell the instructor. Tag the unit “DO NOT OPERATE”.</li>' +
      '<li><b>Electric shock:</b> cut the power first, then call the instructor and the campus clinic. Never use water on an electrical fire.</li>' +
      '<li><b>Serious injury:</b> call 911 and the nearest hospital.</li>' +
      '<li>Report every injury, near miss, spill or unsafe condition to the instructor immediately.</li></ul></div>' },
    { key: 'model', name: '3D Model', html: '@MODEL@' }
  ]
};
</script>
<script>
(function () {
'use strict';
var C = window.CONTENT, PARTS = C.parts, STEPS = C.steps;
function $(s) { return document.querySelector(s); }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

/* ------------------------------------------------------------------ */
/*  Machine state (what the 3D model shows)                            */
/*  tank = litres / 65 · vessel = level in the cone (1 = cone full)    */
/*  beaker = litres / 5 · gauge: 0.5 = about 100 kPa                   */
/* ------------------------------------------------------------------ */
var DEF = { tank: 0, feed: 'water', pump: 0, gauge: 0, v1: 0, v2: 0, v3: 0, v4: 0,
            drain: 0, faucet: 0, lid: 0, leaf: 0, xray: 0, beaker: 0, sw: 0, vessel: 0, cake: 0, tankdrain: 0 };
function mergeState(s) { var o = {}, k; for (k in DEF) o[k] = DEF[k]; for (k in (s || {})) o[k] = s[k]; return o; }

/* ------------------------------------------------------------------ */
/*  3D scene                                                           */
/* ------------------------------------------------------------------ */
function init3D() {
  var T = window.THREE, cv = $('#c');
  var renderer = new T.WebGLRenderer({ canvas: cv, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = T.PCFSoftShadowMap;
  renderer.outputEncoding = T.sRGBEncoding;

  var scene = new T.Scene();
  var camera = new T.PerspectiveCamera(38, 1, 0.05, 60);
  var root = new T.Group(); root.scale.x = -1; scene.add(root);   /* mirrored: seen from the breaker, tank on the left and vessel on the right */

  scene.add(new T.HemisphereLight(0xf4f7fb, 0x7d8896, 0.78));
  var sun = new T.DirectionalLight(0xffffff, 1.05);
  sun.position.set(2.2, 3.6, 2.6); sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.025;
  var sc = sun.shadow.camera; sc.left = -2.5; sc.right = 2.5; sc.top = 2.5; sc.bottom = -2.5; sc.near = 0.5; sc.far = 12;
  scene.add(sun); sun.target.position.set(-0.18, 0.4, 0.4); scene.add(sun.target);
  var fill = new T.DirectionalLight(0xdbe6ff, 0.32); fill.position.set(-2, 2, -2); scene.add(fill);
  var floor = new T.Mesh(new T.PlaneGeometry(12, 12), new T.ShadowMaterial({ opacity: 0.24 }));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

  /* ---- registry ---- */
  var P = {}, pickables = [];
  Object.keys(PARTS).forEach(function (id) { P[id] = { objs: [], box: null }; });
  function reg(m, id) {
    if (!P[id]) throw new Error('Unknown part: ' + id);
    m.material = m.material.clone();
    m.userData.part = id; m.castShadow = true; m.receiveShadow = true;
    pickables.push(m); P[id].objs.push(m); return m;
  }
  function M(c, o) {
    o = o || {};
    return new T.MeshStandardMaterial({
      color: c, roughness: o.r !== undefined ? o.r : 0.55, metalness: o.m !== undefined ? o.m : 0.2,
      transparent: !!o.t, opacity: o.o !== undefined ? o.o : 1, side: o.d ? T.DoubleSide : T.FrontSide
    });
  }
  function put(parent, mesh, x, y, z) { mesh.position.set(x || 0, y || 0, z || 0); (parent || root).add(mesh); return mesh; }
  function Box(w, h, d, m, part, parent, x, y, z) {
    var o = put(parent, new T.Mesh(new T.BoxGeometry(w, h, d), m), x, y, z); return part ? reg(o, part) : o;
  }
  function Cyl(rt, rb, h, m, part, parent, x, y, z, ax, seg, open) {
    var o = new T.Mesh(new T.CylinderGeometry(rt, rb, h, seg || 28, 1, !!open), m);
    if (ax === 'x') o.rotation.z = Math.PI / 2; else if (ax === 'z') o.rotation.x = Math.PI / 2;
    put(parent, o, x, y, z); return part ? reg(o, part) : o;
  }
  function Sph(r, m, part, parent, x, y, z) {
    var o = put(parent, new T.Mesh(new T.SphereGeometry(r, 18, 12), m), x, y, z); return part ? reg(o, part) : o;
  }
  function Torus(R, tube, m, part, parent, x, y, z, flat) {
    var o = new T.Mesh(new T.TorusGeometry(R, tube, 8, 40), m);
    if (flat) o.rotation.x = Math.PI / 2;
    put(parent, o, x, y, z); return part ? reg(o, part) : o;
  }
  /* cylinder between two points; rA at point a, rB at point b (seg 4 = tapered square leg) */
  function Limb(a, b, rA, rB, m, part, seg) {
    var A = new T.Vector3(a[0], a[1], a[2]), B = new T.Vector3(b[0], b[1], b[2]);
    var d = B.clone().sub(A), len = d.length();
    var gm = new T.CylinderGeometry(rB, rA, len, seg || 14);
    if (seg === 4) gm.rotateY(Math.PI / 4);
    var o = new T.Mesh(gm, m);
    o.position.copy(A).add(d.clone().multiplyScalar(0.5));
    o.quaternion.setFromUnitVectors(new T.Vector3(0, 1, 0), d.clone().normalize());
    root.add(o); return part ? reg(o, part) : o;
  }
  /* flat bar between two points (w wide, t thick), thickness facing outward */
  function Bar(a, b, w, t, m, part) {
    var A = new T.Vector3(a[0], a[1], a[2]), B = new T.Vector3(b[0], b[1], b[2]);
    var d = B.clone().sub(A), len = d.length(), y = d.clone().normalize();
    var n = new T.Vector3(d.x, 0, d.z); if (n.lengthSq() < 1e-6) n.set(1, 0, 0); n.normalize();
    var x = new T.Vector3().crossVectors(y, n).normalize(), z = new T.Vector3().crossVectors(x, y).normalize();
    var o = new T.Mesh(new T.BoxGeometry(w, len, t), m);
    o.quaternion.setFromRotationMatrix(new T.Matrix4().makeBasis(x, y, z));
    o.position.copy(A).add(d.clone().multiplyScalar(0.5));
    root.add(o); return part ? reg(o, part) : o;
  }
  var PR = 0.019; /* 1-1/2 in pipe, radius */
  function Path(pts, r, m, part) {
    var i, s;
    for (i = 0; i < pts.length - 1; i++) Limb(pts[i], pts[i + 1], r, r, m, part);
    for (i = 1; i < pts.length - 1; i++) {
      s = new T.Mesh(new T.SphereGeometry(r * 1.04, 14, 10), m);
      s.position.set(pts[i][0], pts[i][1], pts[i][2]); root.add(s); reg(s, part);
    }
  }

  /* ---- colours: grey industrial palette ---- */
  var PAINT = '#939ba1', PIPEC = '#8a9298', FIT = '#646c72', BRASS = '#9a7a38', GREENP = '#2b6648', HGREEN = '#2e8c4d', FRAMEC = '#6c7479';
  var pipeM = M(PIPEC, { m: 0.25, r: 0.5 }), fitM = M(FIT, { m: 0.4, r: 0.45 });

  /* ---- animated handles ---- */
  var valves = {}, faucetPiv = null, needle = null, wheel = null, lidG, leafG, swTog = null, swBtn = null, motorG = null;
  function Valve(id, pos, axis, r) {
    var g = new T.Group(); g.position.set(pos[0], pos[1], pos[2]);
    if (axis === 'z') g.rotation.y = Math.PI / 2; else if (axis === 'y') g.rotation.z = Math.PI / 2; else if (axis === 'zf') g.rotation.y = -Math.PI / 2; else if (axis === 'slant') { g.rotation.x = Math.PI - Math.atan2(0.8, 0.6); g.rotation.y = Math.PI / 2; g.rotation.z = Math.PI / 2; } else if (axis === 'yx') { g.rotation.order = 'YXZ'; g.rotation.y = -Math.PI / 2; g.rotation.z = Math.PI / 2; }
    root.add(g);
    Cyl(r * 1.45, r * 1.45, 0.075, M(BRASS, { m: 0.45, r: 0.45 }), id, g, 0, 0, 0, 'x', 20);
    Cyl(r * 1.2, r * 1.2, 0.014, fitM, id, g, 0.05, 0, 0, 'x', 16);
    Cyl(r * 1.2, r * 1.2, 0.014, fitM, id, g, -0.05, 0, 0, 'x', 16);
    Cyl(0.007, 0.007, r * 1.6, M('#777d82', { m: 0.6 }), id, g, 0, r * 1.5, 0, null, 8);
    var piv = new T.Group(); piv.position.y = r * 2.5; g.add(piv);
    Box(0.13, 0.012, 0.026, M(HGREEN, { r: 0.5, m: 0.1 }), id, piv, 0.05, 0, 0);
    valves[id] = piv; return g;
  }

  /* ================= layout constants (metres) ================= */
  var Z0 = 0.24, ZF = 0.42, ZD = Z0 - 0.03, RX = 0.19, YP = 0.74;   /* Z0: pump, motor and tank axis; ZF: feed row = vessel centre */
  var VX = -0.55, VZ = ZF;

  /* ================= conditioning tank: 15 in dia, 58.7 cm high, legs 16.5 cm ================= */
  var TX = 1.07, TZ = Z0 - 0.234, TR = 0.1905, TB = 0.165, TH = 0.587;
  var steel = M('#aab2b7', { m: 0.35, r: 0.38, d: true });   /* generic metal for small parts */
  function brushedTexture() {
    var cv2 = document.createElement('canvas'); cv2.width = 256; cv2.height = 256; var g = cv2.getContext('2d');
    g.fillStyle = '#d2d6d9'; g.fillRect(0, 0, 256, 256);
    for (var q = 0; q < 160; q++) {
      var y = Math.random() * 256, a = 0.025 + Math.random() * 0.05, v = Math.random() < 0.5 ? 255 : 90;
      g.fillStyle = 'rgba(' + v + ',' + v + ',' + (v + 4) + ',' + a + ')'; g.fillRect(0, y, 256, 1 + Math.random() * 1.2);
    }
    var gr = g.createLinearGradient(0, 0, 256, 0);
    gr.addColorStop(0, 'rgba(255,255,255,0.0)'); gr.addColorStop(0.5, 'rgba(255,255,255,0.22)'); gr.addColorStop(1, 'rgba(255,255,255,0.0)');
    g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
    var t2 = new T.CanvasTexture(cv2); t2.encoding = T.sRGBEncoding; t2.wrapS = t2.wrapT = T.RepeatWrapping; return t2;
  }
  var tankTex = null; try { tankTex = brushedTexture(); } catch (e3) { tankTex = null; }
  var tankM = new T.MeshStandardMaterial({ color: tankTex ? 0xffffff : 0xcfd3d6, map: tankTex, metalness: 0.35, roughness: 0.3, side: T.DoubleSide });
  Cyl(TR, TR, TH, tankM, 'tank', root, TX, TB + TH / 2, TZ, null, 56, true);
  Cyl(TR, TR, 0.012, tankM, 'tank', root, TX, TB + 0.006, TZ, null, 56);
  Torus(TR, 0.0064, tankM, 'tank', root, TX, TB + TH, TZ, true);
  [0.5, 0.5 + 2.094, 0.5 + 4.188].forEach(function (a) {
    Limb([TX + Math.cos(a) * 0.15, TB + 0.004, TZ + Math.sin(a) * 0.15], [TX + Math.cos(a) * 0.19, 0, TZ + Math.sin(a) * 0.19], 0.061, 0.047, tankM, 'tank', 4);
  });
  var waterMat = M('#79b6e6', { t: true, o: 0.8, r: 0.15, m: 0 });
  var water = Cyl(0.186, 0.186, 1, waterMat, null, root, TX, TB, TZ, null, 40);
  /* outlet: one nozzle in the tank bottom near the pump-side edge, pipe straight down (tee, suction line, drain valve) */
  var SY = 0.125, XO = TX, DZ = 0.075, NOZY = SY, DRY = SY;
  Cyl(0.02, 0.02, 0.03, steel, 'tank', root, XO, TB - 0.004, TZ, null, 16);
  Cyl(0.026, 0.026, 0.003, M('#2a2d2f', { m: 0.3, r: 0.6 }), 'tank', root, XO, TB + 0.0135, TZ, null, 20);   /* drain hole in the tank floor */
  Cyl(0.014, 0.014, 0.004, M('#0e0f10', { m: 0, r: 0.9 }), 'tank', root, XO, TB + 0.0155, TZ, null, 16);

  /* ================= pump frame, motor, pump, belt ================= */
  var frameM = M(FRAMEC, { m: 0.3, r: 0.55 });
  [-1, 1].forEach(function (s) { Box(0.68, 0.03, 0.03, frameM, 'frame', root, 0.26, 0.09, Z0 + s * 0.18); });
  [-0.075, 0.595].forEach(function (x) { Box(0.03, 0.03, 0.39, frameM, 'frame', root, x, 0.09, Z0); });
  Box(0.2, 0.012, 0.34, frameM, 'frame', root, 0.06, 0.108, Z0);
  Box(0.22, 0.012, 0.30, frameM, 'frame', root, 0.40, 0.108, Z0);
  [[-0.06, -0.17], [-0.06, 0.17], [0.58, -0.17], [0.58, 0.17]].forEach(function (p) {
    Cyl(0.021, 0.026, 0.03, M('#17181a', { r: 0.85, m: 0 }), 'frame', root, p[0], 0.015, Z0 + p[1], null, 18);   /* black rubber stopper foot */
    Cyl(0.008, 0.008, 0.03, M('#8d9296', { m: 0.6 }), 'frame', root, p[0], 0.045, Z0 + p[1], null, 8);
    Box(0.022, 0.05, 0.022, frameM, 'frame', root, p[0], 0.065, Z0 + p[1]);
  });
  /* motor: 34 cm long, axis along z */
  var MX = 0.06, MY = 0.19, motorM = M('#7a8288', { m: 0.35, r: 0.5 });
  motorG = new T.Group(); motorG.position.set(MX, MY, Z0); root.add(motorG);
  Cyl(0.075, 0.075, 0.29, motorM, 'motor', motorG, 0, 0, 0.025, 'z', 30);
  Cyl(0.082, 0.082, 0.06, M('#5f666b', { m: 0.3 }), 'motor', motorG, 0, 0, -0.14, 'z', 30);
  Cyl(0.078, 0.078, 0.025, M('#666d72', { m: 0.3 }), 'motor', motorG, 0, 0, 0.18, 'z', 30);
  var mDk = M('#4f565b', { m: 0.3, r: 0.6 }), mBolt = M('#8d9296', { m: 0.6, r: 0.4 });
  Box(0.092, 0.05, 0.095, M('#6e767c'), 'motor', motorG, 0, 0.1, 0.03);                         /* terminal box on top */
  Box(0.082, 0.008, 0.085, M('#868e94', { m: 0.35 }), 'motor', motorG, 0, 0.129, 0.03);          /* its cover */
  [[-1, -1], [-1, 1], [1, -1], [1, 1]].forEach(function (c) { Cyl(0.005, 0.005, 0.006, mBolt, 'motor', motorG, c[0] * 0.034, 0.134, 0.03 + c[1] * 0.034, null, 6); });
  Cyl(0.009, 0.009, 0.03, mDk, 'motor', motorG, 0.05, 0.1, 0.03, 'x', 10);                        /* cable gland */
  [-1, 1].forEach(function (sx) { [-0.04, 0.1].forEach(function (zz) {                              /* cast mounting feet with bolt holes */
    Box(0.03, 0.03, 0.07, motorM, 'motor', motorG, sx * 0.065, -0.07, zz);
    Cyl(0.007, 0.007, 0.004, mDk, 'motor', motorG, sx * 0.075, -0.0845, zz, null, 10);
  }); });
  Box(0.1, 0.004, 0.025, M('#d9ddde', { r: 0.6, m: 0.1 }), 'motor', motorG, 0, 0.0795, 0.1);   /* name plate on top of the barrel, toward the front */
  [-0.06, -0.02, 0.02, 0.06, 0.1].forEach(function (z) { Torus(0.0765, 0.0035, motorM, 'motor', motorG, 0, 0, z, false); });   /* shallow cooling ribs */
  [-0.01, -0.024, -0.038, -0.052, -0.064].forEach(function (yy) { Box(2 * Math.sqrt(0.074 * 0.074 - yy * yy) * 0.8, 0.0065, 0.004, mDk, 'motor', motorG, 0, yy, -0.1725); });   /* horizontal vent slots in the lower half of the fan cover */
  Torus(0.072, 0.012, M('#7d858b', { m: 0.3, r: 0.5 }), 'motor', motorG, 0, 0, -0.168, false);                                   /* rounded rear of the fan cover */
  [-1, 1].forEach(function (sx) {                                                                                                     /* two capacitor housings, one on each side of the barrel */
    Cyl(0.036, 0.036, 0.17, M('#8d959b', { m: 0.35, r: 0.45 }), 'motor', motorG, sx * 0.1, 0.022, 0.03, 'z', 22);
    Torus(0.036, 0.008, M('#8d959b', { m: 0.35, r: 0.45 }), 'motor', motorG, sx * 0.1, 0.022, 0.115, false);
    Torus(0.036, 0.008, M('#8d959b', { m: 0.35, r: 0.45 }), 'motor', motorG, sx * 0.1, 0.022, -0.055, false);

      hud: function () { return { t: 326, v: 4, p: 100 }; } },
    { id: 'Release', title: 'Close valves 1 and 4, release the pressure', dur: 7, parts: ['v1', 'v4', 'drain', 'gauge'], cam: { az: 0.2, el: 0.3 },
      text: 'Valves 1 and 4 are closed. Then the vessel drain is opened slowly to release the remaining pressure until the gauge reads zero.',
      notes: [{ part: 'drain', text: 'Open slowly' }, { part: 'gauge', text: 'Wait for zero' }],
      fn: function (p) {
        return B({ v1: p < 0.2 ? 1 : 0, v4: p < 0.3 ? 1 : 0, feed: 'pulp', drain: p > 0.35 ? 1 : 0, vessel: L(0.1, 0, seg(p, 0.5, 1)), gauge: 0.5 * (1 - seg(p, 0.4, 0.95)), faucet: 1, beaker: 0.8, cake: 1, xray: 0.85 });
      },
      hud: function (p) { return { t: 326, v: 4, p: Math.round(100 * (1 - seg(p, 0.4, 0.95))) }; } },
    { id: 'BW prep', title: 'Prepare the backwash', dur: 9, parts: ['tank', 'v1', 'v4', 'drain', 'faucet', 'v2', 'v3'], cam: { az: -0.2, el: 0.4 },
      text: 'The remaining mixture is emptied and the tank is filled with about 10 L of clean water. Valve 1, valve 4, the vessel drain and the filter faucet are closed so the water flows in the reverse direction. Then valves 2 and 3 are opened. The filter leaves stay inside the vessel.',
      notes: [{ part: 'tank', text: 'About 10 L clean water' }, { part: 'v2', text: 'Valve 2 open' }, { part: 'v3', text: 'Valve 3 open' }],
      fn: function (p) {
        return B({ feed: 'water', tank: L(0, 0.154, seg(p, 0.05, 0.4)), drain: p < 0.55 ? 1 : 0, faucet: p < 0.55 ? 1 : 0, v2: p > 0.75 ? 1 : 0, v3: p > 0.85 ? 1 : 0, beaker: 0.8, cake: 1 });
      } },
    { id: 'Backwash', nokpa: true, title: 'Run the backwash for 2 to 3 minutes', dur: 12, parts: ['pump', 'v2', 'v3', 'leaves'], cam: { az: -0.45, el: 0.4 },
      text: 'The pump is plugged in and turned on and runs for 2 to 3 minutes. Water flows backwards through the leaves and carries the loosened cake out through valve 3. The pressure shown on the gauge here is schematic.',
      notes: [{ part: 'v2', text: 'Water enters in reverse' }, { part: 'v3', text: 'Cake and wash water leave' }],
      fn: function (p) {
        var on = p > 0.08;
        return B({ feed: 'water', v2: 1, v3: 1, sw: on ? 1 : 0, pump: on ? 1 : 0, tank: L(0.154, 0.04, p), vessel: on ? 0.7 : 0, gauge: on ? 0.25 : 0, beaker: 0.8, cake: L(1, 0.25, seg(p, 0.1, 1)), xray: 0.85 });
      },
      hud: function (p) { return { t: 150 * p, v: 4, p: null, bw: true }; } },
    { id: 'BW stop', nokpa: true, title: 'Switch off, close valves 2 and 3', dur: 6, parts: ['switch', 'v2', 'v3', 'gauge'], cam: { az: -0.2, el: 0.35 },
      text: 'The pump is switched off and unplugged first. Then valves 2 and 3 are closed and the remaining pressure is released until the gauge reads zero.',
      notes: [{ part: 'switch', text: 'Off and unplugged first' }],
      fn: function (p) {
        var off = p > 0.25;
        return B({ feed: 'water', v2: p < 0.5 ? 1 : 0, v3: p < 0.6 ? 1 : 0, sw: off ? 0 : 1, pump: off ? 0 : 1, tank: 0.04, vessel: L(0.7, 0, seg(p, 0.3, 1)), gauge: 0.25 * (1 - seg(p, 0.5, 0.95)), beaker: 0.8, cake: 0.25, xray: 0.85 });
      } },
    { id: 'Clean', title: 'Open the vessel and clean the leaves', dur: 9, parts: ['lid', 'leaves'], cam: { az: -0.5, el: 0.5 },
      text: 'With the gauge at zero the vessel is opened. The loosened cake is removed with the plastic scraper, the leaves are rinsed and the filter cloth is gently brushed. The cloth is checked for tears or clogging, the lid gasket is checked, and the vessel is closed firmly.',
      notes: [{ part: 'leaves', text: 'Scrape, rinse, brush (no metal tools)' }],
      fn: function (p) { return B({ feed: 'water', tank: 0.04, lid: p > 0.1 ? 1 : 0, leaf: seg(p, 0.25, 0.4) > 0 ? 1 : 0, cake: p < 0.55 ? 0.25 : 0, beaker: 0.8 }); } },
    { id: 'Reset', title: 'Reset the valves for filtration', dur: 5, parts: ['v1', 'v4', 'v2', 'v3', 'lid'], cam: { az: 0.2, el: 0.35 },
      text: 'The vessel is closed and the valves are reset for filtration: valves 1 and 4 open, valves 2 and 3 closed. The cake and wash water are disposed of in the organic waste. The equipment is ready for the next trial.',
      notes: [{ part: 'v1', text: 'Valve 1 open' }, { part: 'v4', text: 'Valve 4 open' }],
      fn: function (p) { return B({ feed: 'water', tank: 0.04, lid: p < 0.25 ? 1 : 0, leaf: p < 0.1 ? 1 : 0, v1: p > 0.5 ? 1 : 0, v4: p > 0.65 ? 1 : 0, beaker: p > 0.3 ? 0 : 0.8 }); } }
  ];
  var starts = [], total = 0;
  ST.forEach(function (s) { starts.push(total); total += s.dur; });
  var t = 0, playing = true, speed = 1, idx = -1, hudAcc = 0, lastHud = '';

  function fmtT(s) { s = Math.round(s); var m = Math.floor(s / 60); return m + ':' + (s % 60 < 10 ? '0' : '') + (s % 60); }
  function stageAt(x) { var i = ST.length - 1; while (i > 0 && x < starts[i]) i--; return i; }
  function dots() {
    var h = '<div class="sdots">';
    ST.forEach(function (s, i) { h += '<i data-sstage="' + i + '" class="' + (i < idx ? 'done' : i === idx ? 'act' : '') + '"' + (i === idx ? ' style="--p:' + Math.round(cl((t - starts[i]) / s.dur) * 100) + '%"' : '') + ' title="' + s.title + '"></i>'; });
    return h + '</div>';
  }
  function render() {
    var s = ST[idx], el = $('#sim');
    el.style.setProperty('--ac', '#e8981a');
    var done = t >= total - 0.001;
    el.innerHTML = '<div class="sbody"><div class="top"><span class="eyeb" style="margin:0"><i class="badge">Simulation</i></span><button class="x" data-sact="exit" aria-label="Close">×</button></div>' +
      dots() + '<div class="eyeb">Stage ' + (idx + 1) + ' of ' + ST.length + '</div><h2>' + esc(s.title) + '</h2><p>' + s.text + '</p>' +
      '<div class="hud" id="simHud"></div><div class="simnote">Times, volumes and the 100 kPa pressure are the illustrative sample values in the manual. Liquid levels inside the equipment are schematic.</div></div>' +
      '<div class="nav"><button class="ic" data-sact="prev" aria-label="Previous stage">‹</button><button class="pri" data-sact="play">' + (done ? '↻ Replay' : playing ? '❚❚ Pause' : '▶ Play') + '</button>' +
      '<button class="ic" data-sact="next" aria-label="Next stage">›</button><button class="spd" data-sact="speed" aria-label="Speed">' + speed + '×</button><button class="ic" data-sact="reset" aria-label="Reset">⟲</button></div>';
    lastHud = ''; hud(true);
  }
  function hud(force) {
    var s = ST[idx], p = cl((t - starts[idx]) / s.dur), h = s.hud ? s.hud(p) : null, el = $('#simHud'); if (!el) return;
    var st = s.fn(p), kpa = s.nokpa ? null : h && h.p !== undefined ? h.p : Math.round(st.gauge * KPA), time = h ? h.t : null;
    var html = '<div><b>' + (kpa === null ? 'n/a' : kpa) + '</b><span>kPa</span></div>' +
      '<div><b>' + (time === null ? '–' : fmtT(time)) + '</b><span>' + (h && h.bw ? 'Backwash' : 'Time') + '</span></div>' +
      '<div><b>' + (h && !h.bw ? h.v.toFixed(2) : st.beaker ? (st.beaker * 5).toFixed(2) : '0.00') + '</b><span>Filtrate L</span></div>' +
      '<div><b>' + (h && h.t > 0 && !h.bw ? Math.floor(h.t / 30) : '–') + '</b><span>Readings</span></div>';
    if (html !== lastHud || force) { el.innerHTML = html; lastHud = html; }
  }
  function enter() {
    var s = ST[idx];
    gl.setHighlight(s.parts); gl.focus(s.parts, s.cam || {}); gl.setNotes(s.notes || []);
    render();
  }
  function tick(dt) {
    if (playing) { t += dt * speed; if (t >= total) { t = total; playing = false; render(); } }
    var i = stageAt(Math.min(t, total - 1e-6));
    if (i !== idx) { idx = i; enter(); }
    var s = ST[idx], p = cl((t - starts[idx]) / s.dur);
    gl.setState(s.fn(p));
    hudAcc += dt; if (hudAcc > 0.1) { hudAcc = 0; hud(); var a = $('#sim .sdots .act'); if (a) a.style.setProperty('--p', Math.round(p * 100) + '%'); }
  }
  function seekStage(i) { i = Math.max(0, Math.min(ST.length - 1, i)); t = starts[i]; idx = -1; playing = true; tick(0); }
  function start() {
    t = 0; playing = true; speed = 1; idx = -1;
    if (!gl) { toast('3D view is not available on this device'); return false; }
    gl.onFrame = tick; tick(0); return true;
  }
  function stop() { if (gl) { gl.onFrame = null; gl.setNotes([]); } }
  function act(a, el) {
    if (a === 'exit') go('home');
    else if (a === 'play') { if (t >= total - 0.001) { seekStage(0); } else { playing = !playing; render(); } }
    else if (a === 'next') seekStage(idx + 1);
    else if (a === 'prev') seekStage(t - starts[idx] > 1.5 ? idx : idx - 1);
    else if (a === 'reset') { seekStage(0); playing = false; render(); }
    else if (a === 'speed') { speed = speed === 1 ? 2 : speed === 2 ? 4 : 1; render(); }
  }
  return {
    start: start, stop: stop, act: act, stage: function (i) { seekStage(i); }, count: ST.length,
    toggle: function () { act('play'); }, next: function () { seekStage(idx + 1); }, prev: function () { act('prev'); }, total: total
  };
})();

/* ---------- boot ---------- */
function loadThree() {
  return new Promise(function (res, rej) {
    if (window.THREE) return res();
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js';
    s.onload = function () { window.THREE ? res() : rej(); }; s.onerror = rej;
    document.head.appendChild(s);
  });
}
function boot() {
  $('#ttl').textContent = C.title;
  $('#sub').textContent = C.subtitle + ' · ' + C.group.section.replace('BS Chemical Engineering', 'BSChE');
  $('#homeFoot').textContent = C.group.section + ' · ' + C.group.term;
  $('#sheet').addEventListener('click', onSheetClick);
  $('#home').addEventListener('click', function (e) { var t = e.target.closest('[data-tab]'); if (t) openInfo(t.dataset.tab); });
  $('#infoOv').addEventListener('click', onInfoClick);
  $('#bStart').addEventListener('click', function () { go('step', 0); });
  $('#bSim').addEventListener('click', function () { if (!gl) { toast('3D view is not available'); return; } go('sim'); SIM.start(); });
  $('#sim').addEventListener('click', function (e) { var t = e.target.closest('[data-sact],[data-sstage]'); if (!t) return; if (t.dataset.sstage !== undefined) SIM.stage(parseInt(t.dataset.sstage, 10)); else SIM.act(t.dataset.sact); });
  $('#bInfo').addEventListener('click', function () { openInfo(); });
  $('#bLabels').addEventListener('click', function () { labelsOn = !labelsOn; this.classList.toggle('on', labelsOn); if (gl) gl.setLabels(labelsOn); toast(labelsOn ? 'Labels on' : 'Labels off'); });
  $('#bXray').addEventListener('click', function () { xrayOn = !xrayOn; this.classList.toggle('on', xrayOn); if (gl) gl.setOverride('xray', xrayOn); toast(xrayOn ? 'X-ray: vessel is see-through' : 'X-ray off'); });
  $('#bCover').addEventListener('click', function () { coverOn = !coverOn; this.classList.toggle('on', coverOn); if (gl) gl.setOverride('lid', coverOn); toast(coverOn ? 'Cover lifted' : 'Cover closed'); });
  $('#bReset').addEventListener('click', function () { if (gl) { presetIdx = 0; $('#vName').textContent = 'View'; if (mode === 'home' && !selPart) gl.preset(0.65, 0.36); else gl.home(); } if (mode === 'home' && selPart) { selPart = null; refresh(); } toast('View reset'); });
  $('#bView').addEventListener('click', function () {
    presetIdx = (presetIdx + 1) % PRESETS.length; var p = PRESETS[presetIdx];
    $('#vName').textContent = p[0]; toast('View: ' + p[0]);
    if (gl) { if ((mode === 'home' && !selPart) || mode === 'sim') gl.preset(p[1], p[2]); else gl.focus(selPart ? [selPart] : STEPS[stepIdx].parts, { az: p[1], el: p[2] }); }
  });
  document.addEventListener('keydown', onKey);
  setTimeout(hideCoach, 9000);
  renderSheet();
  window.addEventListener('resize', function () { updateInset(); });
  if (window.ResizeObserver) { var ro = new ResizeObserver(function () { updateInset(); }); ro.observe($('#sheet')); ro.observe($('#home')); }
  loadThree().then(function () {
    try {
      gl = init3D();
      gl.onPick = choosePart; gl.onHover = onHover;
      gl.isHome = function () { return mode === 'home' && !selPart; };
      $('#c').addEventListener('pointerdown', hideCoach);
      updateInset(); applyScene();
    } catch (err) {
      gl = null;
      var f = $('#fallback'); f.style.display = 'block';
      f.textContent = '3D view could not start on this device. The procedure and component information still work. Open Info.';
      if (window.console) console.error(err);
    }
  }).catch(function () {
    var f = $('#fallback'); f.style.display = 'block';
    f.textContent = 'The 3D library could not load. Check your internet connection. The procedure and component information still work. Open Info.';
  });
}
boot();
})();
</script>
